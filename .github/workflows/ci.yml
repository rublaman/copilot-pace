name: Validate and package
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['24.21.0', '26.11.1']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  integration:
    runs-on: windows-latest
    strategy:
      matrix:
        vscode: ['1.120.0', '1.141.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration -- --label ${{ matrix.vscode }}
  package:
    needs: [checks, integration]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run test:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: copilot-pace-vsix
          path: dist/copilot-pace-*.vsix
