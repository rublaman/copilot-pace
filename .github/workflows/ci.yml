name: Validate and package

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['24.21.0', '26.11.1']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit

  integration:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        vscode: ['1.120.0', '1.141.0']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration -- --label ${{ matrix.vscode }}

  package:
    needs: [checks, integration]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - name: Build and validate production VSIX
        run: npm run test:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: copilot-pace-production-vsix
          path: |
            dist/copilot-pace-*.vsix
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30
