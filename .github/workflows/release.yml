name: Prepare release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
      - name: Validate annotated tag, source branch and release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs $env:RELEASE_TAG
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: copilot-pace-release-notes
          path: dist-release-notes.md
          if-no-files-found: error
          retention-days: 30

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: [validate, test]
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: copilot-pace-production-vsix
          path: candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          name: copilot-pace-release-notes
          path: candidate
      # This job handles files only; it never executes code from the candidate.
      - name: Verify the tested artifact and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $info = Get-Content candidate/build-info.json -Raw | ConvertFrom-Json
          $expectedFile = "copilot-pace-$env:RELEASE_VERSION.vsix"
          $preview = $env:RELEASE_PRERELEASE -eq 'true'
          if ($info.sha -cne $env:RELEASE_SHA -or $info.dirty -ne $false -or
              $info.version -cne $env:RELEASE_VERSION -or $info.preview -ne $preview -or
              $info.name -cne 'copilot-pace' -or $info.publisher -cne 'rublaman' -or
              $info.file -cne $expectedFile) { throw 'Artifact provenance differs from the candidate.' }
          $vsix = Join-Path 'candidate' $expectedFile
          if (@(Get-ChildItem candidate -Filter '*.vsix').Count -ne 1) { throw 'Expected exactly one VSIX.' }
          $checksum = (Get-Content candidate/SHA256SUMS.txt -Raw).Trim()
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $vsix).Hash.ToLowerInvariant()
          if ($checksum -cne "$hash  $expectedFile" -or $info.sha256 -cne $hash) { throw 'VSIX checksum mismatch.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsix).Path)
          try {
              $entry = $zip.GetEntry('extension/package.json')
              if (-not $entry) { throw 'The VSIX manifest is missing.' }
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
              if ($manifest.version -cne $env:RELEASE_VERSION -or $manifest.preview -ne $preview -or
                  $manifest.name -cne $info.name -or $manifest.publisher -cne $info.publisher) {
                  throw 'Packaged manifest differs from the release.'
              }
          } finally { $zip.Dispose() }
          $existing = gh api "repos/$env:GH_REPO/releases" --paginate --jq '.[].tag_name'
          if ($existing -contains $env:RELEASE_TAG) { throw 'A release already exists; do not replace its assets.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = Get-Content candidate/dist-release-notes.md -Raw
          $notes += "`n`nValidation run: $($info.runUrl)`n`nVSIX SHA-256: $hash`n"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $vsix,
              'candidate/SHA256SUMS.txt', 'candidate/build-info.json',
              '--verify-tag', '--draft', '--latest=false',
              '--title', "Copilot Pace $env:RELEASE_VERSION", '--notes-file', $notesPath)
          if ($preview) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
